<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
<title>Snake Arcade</title><link rel="stylesheet" href="style.css"><style>.paf-made-by{position:fixed;right:8px;bottom:8px;width:min(72px,12vw);max-width:12vw;height:auto;object-fit:contain;opacity:.5;background:transparent;padding:0;border:0;box-shadow:none;filter:none;pointer-events:none;z-index:30}</style></head>
<body><div id="net"></div><button id="gear" aria-label="Settings">⚙</button><button id="chat-btn" aria-label="Chat">💬</button>
<div id="app-container">
<header><div class="score-board">
<div class="score-box"><span class="label" data-i18n="score">SCORE</span><span id="score-display" class="value">0</span></div>
<div class="score-box"><span class="label" id="info-label">ROOM</span><span id="info-display" class="value">-</span></div></div>
<div id="active-powerup" class="powerup-indicator hidden"><span id="powerup-text"></span></div></header>
<div id="game-wrapper"><canvas id="gameCanvas" width="600" height="600"></canvas><div id="game-chat"></div>
<div id="overlay-container">
<div id="screen-menu" class="screen active scroll">
 <h1 class="neon-title">SNAKE ARCADE</h1>
 <div class="row"><button class="btn-secondary lang-btn" id="lang-en">EN</button><button class="btn-secondary lang-btn" id="lang-vi">VI</button></div>
 <input id="name" maxlength="12" placeholder="Name" class="field" data-ph="namePh">
 <div class="row"><input type="color" id="color"><div id="swatches" class="row"></div></div>
 <select id="skin" class="field">
  <option value="solid" data-i18n="skinSolid">Skin: Solid</option>
  <option value="gradient" data-i18n="skinGrad">Skin: Fade</option>
  <option value="dots" data-i18n="skinDots">Skin: Dots</option>
  <option value="stripes" data-i18n="skinStripes">Skin: Stripes</option>
  <option value="glow" data-i18n="skinGlow">Skin: Neon</option>
  <option value="rainbow" data-i18n="skinRainbow">Skin: Rainbow</option>
 </select>
 <label class="row"><input type="checkbox" id="snd" checked> <span data-i18n="sound">Sound</span></label>
 <button class="btn-primary" id="b-solo" data-i18n="quickPlay">QUICK PLAY (1P)</button>
 <button class="btn-secondary" id="b-custom" data-i18n="soloMode">SOLO / PICK MODE</button>
 <button class="btn-secondary" id="b-create" data-i18n="createRoom">CREATE MULTIPLAYER ROOM</button>
 <div class="row"><input id="code" maxlength="4" placeholder="CODE" class="field short" data-ph="codePh"><button class="btn-secondary" id="b-join" data-i18n="joinRoom">JOIN</button></div>
 <div class="row"><button class="btn-secondary" id="b-help" data-i18n="howTo">HOW TO PLAY</button><button class="btn-secondary" id="b-conn" data-i18n="lanBtn">LAN CONNECT</button></div>
 <div id="rooms" class="row"></div><p id="err" class="text-red"></p></div>
<div id="screen-lobby" class="screen scroll">
 <h2 class="neon-subtitle"><span data-i18n="room">ROOM</span> <span id="l-code"></span></h2>
 <div class="row"><select id="mode" class="field">
  <option value="coop" data-i18n="modeCoop">Co-op</option>
  <option value="survival" data-i18n="modeSurv">Survival</option>
  <option value="timeattack" data-i18n="modeTime">Time Attack</option>
  <option value="levels" data-i18n="modeLevels">Campaign</option>
 </select>
 <select id="map" class="field">
  <option value="open">Open Field</option>
  <option value="box">The Box</option>
  <option value="maze">Labyrinth</option>
  <option value="portal">Portal Gate</option>
  <option value="plus">Crossroads</option>
  <option value="ring">The Arena</option>
  <option value="lanes">Highway</option>
  <option value="islands">Islands</option>
  <option value="spiral">Spiral Pit</option>
  <option value="diamond">Diamond</option>
  <option value="forest">Pixel Forest</option>
  <option value="corners">Four Corners</option>
  <option value="checker">Checkers</option>
  <option value="twin">Twin Halls</option>
  <option value="spikes">Spike Field</option>
  <option value="mudflats">Mud Flats</option>
  <option value="turbo">Turbo Track</option>
  <option value="gates">Clockwork Gates</option>
  <option value="snowflake">Snowflake</option>
  <option value="bridges">Spike River</option>
  <option value="pinball">Pinball</option>
  <option value="zigzag">Zigzag Hall</option>
  <option value="octagon">Octagon</option>
  <option value="volcano">Volcano</option>
  <option value="random">🎲 Random</option>
 </select></div>
 <select id="diff" class="field">
  <option value="easy" data-i18n="diffEasy">Easy</option>
  <option value="normal" data-i18n="diffNorm">Normal</option>
  <option value="fast" data-i18n="diffHard">Hard</option>
 </select>
 <p id="modeinfo" class="small"></p>
 <div id="level-preview" class="level-preview"></div>
 <ul id="plist"></ul><div class="row"><button class="btn-secondary" id="b-bot">+ BOT</button><button class="btn-secondary" id="b-unbot">− BOT</button></div><p id="share"></p>
 <div id="invite-box" class="invite-box">
  <div class="qr-card"><img id="qr-public" alt="Public QR"><div class="small">WAN / PLAY</div></div>
  <div class="qr-card"><img id="qr-lan" alt="LAN QR"><div class="small">LAN / Wi-Fi</div></div>
 </div>
 <p id="l-best"></p>
 <div class="row"><input id="bet-target" class="field" maxlength="12" placeholder="Bet on name"><input id="bet-amt" class="field short" value="10"><button class="btn-secondary" id="b-bet">BET</button></div>
 <div id="chat-box" class="chat-box"><div id="chat-log"></div>
  <div class="row"><input id="chat-in" class="field" maxlength="160" placeholder="Room chat · @ai"><button class="btn-secondary" id="chat-send">SEND</button></div></div>

 <button class="btn-primary" id="b-start" data-i18n="start">START</button>
 <button class="btn-back" id="b-leave" data-i18n="leave">LEAVE ROOM</button></div>
<div id="screen-settings" class="screen scroll">
 <h2 class="neon-subtitle" data-i18n="settings">SETTINGS</h2>
 <div class="row"><button class="btn-secondary lang-btn" id="s-lang-en">EN</button><button class="btn-secondary lang-btn" id="s-lang-vi">VI</button></div>
 <input id="s-name" maxlength="12" class="field" placeholder="Name" data-ph="namePh">
 <div class="row"><input type="color" id="s-color"><select id="s-skin" class="field"></select></div>
 <label class="row"><input type="checkbox" id="s-snd"> <span data-i18n="sound">Sound</span></label>
 <label class="row"><input type="checkbox" id="s-vib"> <span data-i18n="vibrate">Vibrate (phone)</span></label>
 <label class="row"><input type="checkbox" id="s-chat"> <span data-i18n="chatOverlay">Show chat on screen</span></label>
 <div id="s-room" class="small"></div><ul id="s-plist"></ul>
 <div class="row"><button class="btn-secondary" id="s-copy" data-i18n="copyInvite">COPY INVITE LINK</button><button class="btn-secondary" id="s-pause" data-i18n="pause">PAUSE</button><button class="btn-secondary" id="s-full" data-i18n="fullscreen">FULLSCREEN</button></div>
 <div class="row"><button class="btn-secondary" id="s-help" data-i18n="howTo">HOW TO PLAY</button><button class="btn-secondary" id="s-conn" data-i18n="lanBtn">LAN CONNECT</button></div>
 <!-- feedback moved into AI panel -->
 <button class="btn-primary" id="s-close" data-i18n="continue">CONTINUE</button><button class="btn-back" id="s-leave" data-i18n="leave">LEAVE ROOM</button></div>
<div id="screen-help" class="screen scroll">
 <h2 class="neon-subtitle" data-i18n="helpTitle">HOW TO PLAY</h2>
 <div class="doc" id="help-body"></div>
 <button class="btn-primary" id="h-close" data-i18n="gotIt">GOT IT</button></div>
<div id="screen-connect" class="screen scroll">
 <h2 class="neon-subtitle" data-i18n="lanTitle">LAN CONNECT</h2>
 <div class="doc"><p data-i18n="lanIntro">Open this URL on phones/TVs on the same Wi-Fi as the host:</p><div id="c-urls"></div><div id="c-qrs" class="invite-box"></div>
 <div id="lan-steps"></div></div>
 <button class="btn-primary" id="c-close" data-i18n="close">CLOSE</button></div>
<div id="screen-over" class="screen scroll">
 <h2 class="neon-title text-red" data-i18n="gameOver">GAME OVER</h2><ul id="results"></ul><p id="o-best"></p>
 <button class="btn-primary" id="b-replay" data-i18n="playAgain">PLAY AGAIN</button>
 <button class="btn-secondary" id="b-again" data-i18n="backLobby">BACK TO ROOM</button><button class="btn-back" id="b-menu" data-i18n="backMenu">MAIN MENU</button></div>
</div></div>
<div class="controls-container"><div class="dpad">
<button id="btn-up" class="dpad-btn up">▲</button><button id="btn-left" class="dpad-btn left">◀</button><div class="dpad-center"></div>
<button id="btn-right" class="dpad-btn right">▶</button><button id="btn-down" class="dpad-btn down">▼</button></div></div>
</div>
<div id="chat-bar" class="chat-bar"><div id="emotes"></div>
 <div class="row"><input id="gc-in" class="field" maxlength="160" placeholder="Chat · @ai" data-ph="chatPh"><button type="button" id="gc-send" class="btn-secondary" data-i18n="send">SEND</button></div></div>
<div id="ai-box">
  <button type="button" id="ai-toggle" title="AI · Feedback · Settings"><img id="ai-icon" src="ai-icon.png" alt="AI"><span id="ai-badge" class="ai-badge" style="display:none">0</span></button>
  <div id="ai-panel">
    <div class="ai-tabs">
      <button type="button" class="ai-tab on" data-tab="chat" id="tab-chat">Chat</button>
      <button type="button" class="ai-tab" data-tab="feedback" id="tab-feedback">Feedback<span id="fb-tab-badge" class="ai-badge-sm" style="display:none">0</span></button>
      <button type="button" class="ai-tab" data-tab="settings" id="tab-settings">Settings</button>
      <button type="button" class="ai-tab" data-tab="logs" id="tab-logs">Logs</button>
    </div>
    <div class="ai-pane on" id="pane-chat">
      <div class="ai-head"><span id="ai-chip" class="ai-chip">…</span></div>
      <div id="ai-log"></div>
      <div class="row"><input id="ai-in" class="field" maxlength="200" placeholder="Ask about the game…" data-ph="aiAsk"><button type="button" id="ai-send" class="btn-secondary" data-i18n="send">SEND</button></div>
    </div>
    <div class="ai-pane" id="pane-feedback">
      <div id="fb-hub-notices" class="fb-notes"></div>
      <div id="fb-donate" class="fb-donate" style="display:none"></div>
      <div id="fb-update" class="fb-note" style="display:none"></div>
      <select id="fb-type" class="field"><option value="bug">Bug</option><option value="idea">Idea</option><option value="other">Other</option></select>
      <textarea id="fb-text" class="field" rows="3" maxlength="1000" placeholder="Describe the issue or idea…"></textarea>
      <div id="fb-stars" class="row" aria-label="Rating"><button type="button" data-n="1">★</button><button type="button" data-n="2">★</button><button type="button" data-n="3">★</button><button type="button" data-n="4">★</button><button type="button" data-n="5">★</button></div>
      <div class="row"><button type="button" id="fb-send" class="btn-primary">SEND FEEDBACK</button></div>
      <p id="fb-msg" class="small"></p>
      <div id="fb-pay" style="display:none">
        <input id="fb-txn" class="field" maxlength="120" placeholder="Transaction ID" autocomplete="off">
        <input id="fb-method" class="field" maxlength="30" placeholder="Method (e.g. pi)" autocomplete="off">
        <input id="fb-amount" class="field" maxlength="20" placeholder="Amount" autocomplete="off">
        <div class="row"><button type="button" id="fb-paysend" class="btn-primary">SEND</button><button type="button" id="fb-paycancel" class="btn-back">CANCEL</button></div>
      </div>
      <div id="fb-status" class="small"></div>
    </div>
    <div class="ai-pane" id="pane-settings">
      <p class="small">AI provider key (saved on this device/server only).</p>
      <select id="ai-provider" class="field" aria-label="AI provider">
        <option value="auto">Auto / Detect</option>
        <option value="openai">OpenAI</option><option value="deepseek">DeepSeek</option><option value="groq">Groq</option>
        <option value="openrouter">OpenRouter</option><option value="mistral">Mistral</option><option value="xai">xAI</option>
        <option value="gemini">Google Gemini</option><option value="anthropic">Anthropic</option>
        <option value="ollama">Ollama (local)</option><option value="lmstudio">LM Studio (local)</option>
        <option value="local">Local OpenAI-compatible</option><option value="custom">Custom OpenAI-compatible</option>
      </select>
      <select id="ai-model" class="field" aria-label="Model"><option value="">Auto model</option></select>
      <div class="row"><input id="ai-token" class="field" type="password" maxlength="300" placeholder="API key / token" autocomplete="off"><button type="button" id="ai-check" class="btn-secondary">CHECK</button></div>
      <input id="ai-base-url" class="field" maxlength="500" placeholder="Base URL (custom / local)" autocomplete="off">
      <input id="ai-pin" class="field" type="password" maxlength="40" placeholder="Admin PIN" autocomplete="off" style="display:none">
      <p id="ai-msg" class="small"></p>
      <div class="row"><button type="button" id="ai-save" class="btn-primary">SAVE &amp; TEST</button><button type="button" id="ai-remove" class="btn-secondary">REMOVE KEY</button></div>
    </div>
    <div class="ai-pane" id="pane-logs">
      <div class="row"><button type="button" id="log-refresh" class="btn-secondary">REFRESH</button><button type="button" id="log-clear" class="btn-secondary">CLEAR</button></div>
      <pre id="app-log-view" class="app-log-view">—</pre>
    </div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script><script src="communication-pause.js"></script><script src="game.js"></script><script src="feedback.js"></script><img class="paf-made-by" src="/made-by.png" alt="Made with App Builder — Pi SoloHost"></body></html>
